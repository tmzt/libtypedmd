[package]
name = "libtypedmd_pulldown"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "A `pulldown-cmark` block substrate for libtypedmd, GFM disabled."

# The dependency lives HERE and only here. `libtypedmd` itself stays at zero
# dependencies; this crate is the sibling adapter the trait exists for.
[dependencies]
libtypedmd = { path = "../libtypedmd" }
pulldown-cmark = { version = "0.13", default-features = false }
